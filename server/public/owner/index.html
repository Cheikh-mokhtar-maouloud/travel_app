<style>
  :root { --accent: #3b2f8f; --accent-soft: #ecebf8; }
  .side { background: #1b1640; }

  .btn.primary:hover { background: #2c2370; }
  .bar { height: 10px; border-radius: 5px; background: var(--accent); }
